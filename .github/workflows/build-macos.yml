name: Build macOS Release (.dmg)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview pyobjc

      - name: Build macOS App Bundle (.app)
        run: |
          cd backend
          pyinstaller ImageCullerAI_mac.spec --clean --noconfirm

      - name: Package into macOS Disk Image (.dmg)
        run: |
          mkdir -p release
          hdiutil create \
            -volname "MicMose Photo Culler Pro" \
            -srcfolder "backend/dist/MicMose Photo Culler Pro.app" \
            -ov -format UDZO \
            "release/MicMose-Photo-Culler-Pro-macOS.dmg"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicMose-Photo-Culler-Pro-macOS-dmg
          path: release/MicMose-Photo-Culler-Pro-macOS.dmg

      - name: Attach DMG to Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.ref_name }} >/dev/null 2>&1 || \
          gh release create ${{ github.ref_name }} \
            --title "MicMose Photo Culler Pro ${{ github.ref_name }}" \
            --notes-file backend/release_notes.md || true
          gh release upload ${{ github.ref_name }} \
            "release/MicMose-Photo-Culler-Pro-macOS.dmg" \
            --clobber
